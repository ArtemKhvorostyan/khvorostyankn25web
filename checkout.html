<!DOCTYPE html>
<html lang="uk">
<head>
    <link rel="stylesheet" href="assets/css/normalize.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/style.css">\
    <link rel="preconnect" href="http://fonts.google.com/specimen/Inter">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechShop - Магазин гаджетів</title>
</head>
<body>
    <header class="header">
        <div class="logo">TechShop</div>
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="url">Головна</a></li>
                <li><a href="url">Товари</a></li>
                <li><a href="url">Про нас</a></li>
                <li><a href="url">Контакти</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <button class="btn btn-cart">Кошик (0)</button>
        </div>
    </header>

    <main>
        <h2>Оформлення замовлення</h2>
        <form action="#" method="POST" class="checkout-form">
        <fieldset>
            <legend>1. Особисті дані</legend>
            <div class="form-group">
                <label for="fullName">ПІБ:</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    required
                    placeholder="Іванов Іван Іванович"
                />
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required />
            </div>
            <div class="form-group">
                <label for="phone">Телефон:</label>
                <input
                type="tel"
                id="phone"
                name="phone"
                pattern="[\+]\d{2}\d{10}"
                placeholder="+380991234567"
                required
                title="Формат: +380XXXXXXXXX"
                />
            </div>
        </fieldset>

        <fieldset>
            <legend>2. Спосіб доставки</legend>
            <div class="form-radio">
                <input
                type="radio"
                id="deliveryNova"
                name="delivery"
                value="nova_poshta"
                checked
                />
                <label for="deliveryNova">Нова Пошта</label>
            </div>
            <div class="form-radio">
                <input
                type="radio"
                id="deliveryCourier"
                name="delivery"
                value="courier"
                />
                <label for="deliveryCourier">Кур'єр за адресою</label>
            </div>

            <div class="form-group">
                <label for="city">Місто:</label>
                <select id="city" name="city">
                <option value="kyiv">Київ</option>
                <option value="lviv">Львів</option>
                <option value="odesa">Одеса</option>
                </select>
            </div>
        </fieldset>
        
        <textarea></textarea>
        <input type="checkbox" required>Я погоджуюсь з правилами магазину
        <button type="submit" class="btn btn-primary">Підтвердити замовлення</button>
        </form>
    </main>
</body>
</html>
